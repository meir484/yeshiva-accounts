<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>חשבונות משרד הישיבה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="wrap login" hidden>
  <form class="dialog" id="loginForm">
    <h1>חשבונות משרד הישיבה</h1>
    <div class="sub" style="margin-bottom:16px">כניסה למורשים בלבד</div>
    <div class="form" style="grid-template-columns:1fr">
      <div class="field"><label for="lEmail">אימייל</label><input type="text" id="lEmail" autocomplete="username" inputmode="email" dir="ltr" required></div>
      <div class="field"><label for="lPass">סיסמה</label><input type="password" id="lPass" autocomplete="current-password" dir="ltr" required style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%"></div>
    </div>
    <div class="form-actions"><button class="btn primary" id="loginBtn" type="submit">כניסה</button><button class="link" id="forgot" type="button">שכחתי סיסמה</button></div>
    <div class="msg" id="loginMsg" role="alert"></div>
  </form>
</div>
<div id="setup" class="wrap" hidden><div class="panel empty" style="margin-top:40px">האתר עדיין לא הוגדר. יש למלא את הקובץ <b>config.js</b> לפי ההוראות בקובץ SETUP.md.</div></div>
<div class="wrap" id="app" hidden>
  <header class="top">
    <div>
      <h1>חשבונות משרד הישיבה</h1>
      <div class="sub" id="subline">טוען נתונים…</div>
    </div>
    <div class="head-tools"><span class="who" id="who"></span><span class="role" id="role" hidden></span><button class="btn small" id="logout">יציאה</button></div>
  </header>
  <div id="yearbar" style="margin-bottom:12px"></div>
  <div id="kpis"></div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="main"></main>
</div>
<div id="overlay"></div>
<div id="overlay2"></div>
<div id="toast" class="toast" hidden></div>
<script src="config.js"></script>
<script src="api.js"></script>
<script src="import.js"></script>
<script src="app.js"></script>
</body>
</html>
